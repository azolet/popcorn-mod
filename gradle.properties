# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.1.0
group=it.argo.mc.mods

# Dependencies
fabric_api_version=0.141.6+1.21.11

# Optional: development client with shaders.
# Uncomment and fill in the versions for this Minecraft version from the Modrinth
# pages below, then ./gradlew runClient installs them and starts with shaders on.
# Left commented out, the build and the dev client are unchanged.
#   https://modrinth.com/mod/iris/versions
#   https://modrinth.com/mod/sodium/versions
#   https://modrinth.com/shader/complementary-reimagined/versions
#iris_version=
#sodium_version=
#shaderpack=complementary-reimagined:<version>
