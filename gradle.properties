# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.1.0
group=it.argo.mc.mods

# Dependencies
fabric_api_version=0.141.6+1.21.11

# Optional: development client with shaders.
# ./gradlew runClient installs these and starts with shaders enabled. Versions
# come from the Modrinth pages below and are specific to the Minecraft version.
#   https://modrinth.com/mod/iris/versions
#   https://modrinth.com/mod/sodium/versions
#   https://modrinth.com/shader/bsl-shaders/versions
# Comment these three out to go back to a plain dev client.
iris_version=1.10.7+1.21.11-fabric
sodium_version=mc1.21.11-0.8.7-fabric
shaderpack=bsl-shaders:10.1.8
