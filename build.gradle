plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Iris, Sodium and shader packs for the development client. Scoped to the
	// maven.modrinth group, so nothing else is ever resolved from here.
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

// A shader pack is a zip, not a jar, so it gets its own configuration and is
// copied into the run directory rather than put on the classpath.
// Iris, Sodium and the shader pack for the development client. Both are copied
// into run/ as ordinary files rather than put on the classpath: Iris nests jcpp,
// glsl-transformer and antlr inside its own jar, and those survive only when
// Fabric Loader unpacks the jar itself. A remapped classpath mod loses them.
//
// Gradle 9 no longer creates a configuration from a bare name inside the
// configurations block, so create them explicitly. 'shaderpacks' is plural to
// stay distinct from the 'shaderpack' property that picks which pack to fetch.
configurations.create('devmods')
configurations.create('shaderpacks')

loom {
	splitEnvironmentSourceSets()

	mods {
		"popcorn" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Adds the "Data Generation" run configuration (./gradlew runDatagen).
	// Output lands in src/main/generated and is bundled as a resource root.
	configureDataGeneration() {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: run the dev client with shaders. Set iris_version, sodium_version
	// and shaderpack in gradle.properties to switch this on; with them unset the
	// build is exactly as it was. These never touch the compile classpath or the
	// published jar — they are dev tooling, not dependencies of the mod.
	if (project.hasProperty('iris_version')) {
		add('devmods', "maven.modrinth:iris:${project.iris_version}")
	}

	if (project.hasProperty('sodium_version')) {
		add('devmods', "maven.modrinth:sodium:${project.sodium_version}")
	}

	if (project.hasProperty('shaderpack')) {
		add('shaderpacks', "maven.modrinth:${project.shaderpack}@zip")
	}
}

// Installs Iris and Sodium into run/mods, replacing whatever was there from a
// previous version so the two never pile up.
def installDevMods = tasks.register('installDevMods', Copy) {
	from configurations.devmods
	into layout.projectDirectory.dir('run/mods')

	doFirst {
		delete fileTree(layout.projectDirectory.dir('run/mods')) {
			include 'iris-*.jar'
			include 'sodium-*.jar'
		}
	}
}

// Drops the shader pack into run/shaderpacks and points Iris at it, so that
// ./gradlew runClient comes up with shaders already on.
def installShaderpack = tasks.register('installShaderpack', Copy) {
	from configurations.shaderpacks
	into layout.projectDirectory.dir('run/shaderpacks')

	doLast {
		def pack = configurations.shaderpacks.files.find { true }

		if (pack != null) {
			def config = layout.projectDirectory.file('run/config/iris.properties').asFile
			config.parentFile.mkdirs()
			def props = new Properties()

			if (config.exists()) {
				config.withInputStream { props.load(it) }
			}

			props.setProperty('shaderPack', pack.name)
			props.setProperty('enableShaders', 'true')
			config.withOutputStream { props.store(it, 'shader pack selected by the installShaderpack task') }
		}
	}
}

tasks.named('runClient') {
	dependsOn installDevMods, installShaderpack
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
